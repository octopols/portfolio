<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Résumé — Hirnaymay Bhaskar</title>
    <meta
      name="description"
      content="Résumé of Hirnaymay Bhaskar, backend engineer in Bengaluru — messaging, billing and event infrastructure."
    />
    <link rel="canonical" href="https://hirnaymay.com/resume/" />
    <meta property="og:title" content="Hirnaymay Bhaskar — Résumé" />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://hirnaymay.com/resume/" />
    <meta property="og:image" content="https://hirnaymay.com/assets/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/assets/logos/favicon.png" />
    <meta name="theme-color" content="#050505" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --bg: #050505;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f7fafc;
        --muted: #8b9199;
        --accent: #68d391;
      }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex; flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; }

      .bar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 16px; flex-wrap: wrap;
        padding: 14px 24px; border-bottom: 1px solid var(--line);
        background: rgba(5, 5, 5, 0.9);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      }
      .who { display: flex; align-items: baseline; gap: 12px; }
      .who b { font-size: 15px; letter-spacing: -0.01em; }
      .who span { font-size: 12.5px; color: var(--muted); }
      .acts { display: flex; gap: 10px; }
      .btn {
        display: inline-block; text-decoration: none; white-space: nowrap;
        padding: 8px 16px; border-radius: 999px; font-size: 13px;
        border: 1px solid var(--line); transition: background .2s, border-color .2s, color .2s;
      }
      .btn:hover { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.05); }
      .btn.primary { background: var(--accent); color: #0c2c1a; border-color: var(--accent); font-weight: 600; }
      .btn.primary:hover { background: #fff; border-color: #fff; color: #0c2c1a; }

      .doc { flex: 1 1 auto; min-height: 0; background: #1b1b1b; }
      .doc object, .doc iframe { width: 100%; height: 100%; border: 0; display: block; }

      /* Shown only if the browser refuses to render a PDF inline. */
      .fallback { padding: 56px 24px; text-align: center; color: var(--muted); }
      .fallback a { color: var(--accent); }

      @media (max-width: 640px) {
        .bar { padding: 12px 16px; }
        .who b { font-size: 14px; }
      }
    </style>
  </head>

  <body>
    <div class="bar">
      <div class="who">
        <b>Hirnaymay Bhaskar</b>
        <span>Backend engineer &middot; Bengaluru</span>
      </div>
      <div class="acts">
        <a class="btn" href="/">Portfolio</a>
        <a class="btn" href="mailto:hirnaymay@gmail.com">Email me</a>
        <a class="btn primary" id="dl" href="/docs/hirnaymay_bhaskar_resume.pdf" download>Download PDF</a>
      </div>
    </div>

    <div class="doc">
      <object data="/docs/hirnaymay_bhaskar_resume.pdf#view=FitH" type="application/pdf">
        <div class="fallback">
          <p>Your browser won't display PDFs inline.</p>
          <p><a href="/docs/hirnaymay_bhaskar_resume.pdf">Download the résumé instead &rarr;</a></p>
        </div>
      </object>
    </div>

    <script>
      /**
       * Résumé open logging.
       *
       * Posts to a Google Apps Script web app, which writes one row per open
       * into a spreadsheet you own. No analytics vendor is involved.
       *
       * What it records:
       *   - which tracked link was used  (?s=, generated by /track/)
       *   - where the visit came from    (document.referrer)
       *   - focused reading time, not merely time-with-tab-open
       *   - whether this browser has opened it before, and how many times
       *
       * What it cannot record: who the person is. No browser API exposes that
       * and no other origin's cookies are readable here. Identity comes from
       * knowing which ?s= link you sent to whom.
       *
       * Transport is sendBeacon with a text/plain body. That combination is a
       * "simple request", so it skips the CORS preflight that Apps Script
       * cannot answer — and it still flies while the page is being torn down.
       */
      (function () {
        "use strict";

        // Apps Script web app backing the Google Sheet. Empty = logging off,
        // and the page still works exactly as a résumé.
        var ENDPOINT =
          "https://script.google.com/macros/s/AKfycbyLJ4mLnXWz1YZUZ18u3aiRVjX5Xbph9lkyzVlMinxK_N8O0RMmrZUov4dUxjSyLY7U5w/exec";

        if (!ENDPOINT) return;

        var params = new URLSearchParams(location.search);
        var link = (params.get("s") || params.get("src") || "direct")
          .toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40) || "direct";

        var rnd = function () {
          return (Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 16);
        };

        // Visitor id persists so a second open is recognisable. Session id is
        // per page load, and is what ties later updates to the right row.
        var vid, visits;
        try {
          vid = localStorage.getItem("rv_id");
          if (!vid) { vid = rnd(); localStorage.setItem("rv_id", vid); }
          visits = parseInt(localStorage.getItem("rv_n") || "0", 10) + 1;
          localStorage.setItem("rv_n", String(visits));
        } catch (e) {
          vid = "nostore";
          visits = 1;
        }
        var session = rnd();

        var base = {
          link: link,
          visitor: vid,
          visit: visits,
          returning: visits > 1,
          ref: document.referrer || "direct",
          device: matchMedia("(pointer: coarse)").matches ? "mobile/tablet" : "desktop",
          session: session,
        };

        function send(event, extra) {
          var body = JSON.stringify(Object.assign({ event: event }, base, extra || {}));
          var blob = new Blob([body], { type: "text/plain;charset=UTF-8" });
          if (navigator.sendBeacon && navigator.sendBeacon(ENDPOINT, blob)) return;
          // Older browsers, and any case where the beacon queue is full.
          try {
            fetch(ENDPOINT, { method: "POST", mode: "no-cors", keepalive: true, body: body });
          } catch (e) {}
        }

        send("view");

        /* ---- focused time ------------------------------------------------
           Only accrues while the tab is visible, so a résumé parked in a
           background tab does not read as an hour of rapt attention. */
        var focused = 0;
        var since = document.visibilityState === "visible" ? Date.now() : null;
        function accrue() { if (since !== null) { focused += Date.now() - since; since = null; } }
        function resume() { if (since === null) since = Date.now(); }
        function seconds() {
          return Math.round((focused + (since !== null ? Date.now() - since : 0)) / 1000);
        }

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") { resume(); }
          else { accrue(); send("progress", { seconds: seconds() }); }
        });
        window.addEventListener("blur", accrue);
        window.addEventListener("focus", resume);

        /* ---- milestones --------------------------------------------------
           Each one updates the same row, so if the close beacon is ever lost
           the sheet still holds the last threshold they reached. */
        var marks = [15, 45, 120, 300];
        var hit = {};
        var poll = setInterval(function () {
          var s = seconds();
          for (var i = 0; i < marks.length; i++) {
            if (s >= marks[i] && !hit[marks[i]]) {
              hit[marks[i]] = true;
              send("progress", { seconds: s });
            }
          }
          if (s > 900) clearInterval(poll);
        }, 5000);

        /* ---- leaving ------------------------------------------------------
           pagehide is the one that fires when mobile Safari swipes a tab away;
           beforeunload does not. */
        function close() { accrue(); send("close", { seconds: seconds() }); }
        window.addEventListener("pagehide", close);
        window.addEventListener("beforeunload", close);

        var dl = document.getElementById("dl");
        if (dl) {
          dl.addEventListener("click", function () {
            send("download", { seconds: seconds() });
          });
        }
      })();
    </script>
  </body>
</html>
