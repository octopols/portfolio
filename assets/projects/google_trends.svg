<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-text" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="chartfill-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartfill-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartfill-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ngrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#050510"/>
  <rect width="1600" height="900" fill="url(#ngrid)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="400" cy="700" rx="380" ry="220" fill="#22d3ee" fill-opacity="0.04"/>
  <ellipse cx="1200" cy="200" rx="340" ry="200" fill="#f0abfc" fill-opacity="0.05"/>
  <ellipse cx="900" cy="500" rx="300" ry="200" fill="#4ade80" fill-opacity="0.03"/>

  <!-- Chart area -->
  <g transform="translate(100, 120)">

    <!-- Chart border / panel -->
    <rect width="1400" height="580" rx="4" fill="#050510" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Axis lines -->
    <line x1="80" y1="60" x2="80" y2="500" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="80" y1="500" x2="1360" y2="500" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Y-axis ticks -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#22d3ee" fill-opacity="0.4">
      <text x="60" y="108" text-anchor="end">100</text>
      <text x="60" y="210" text-anchor="end">75</text>
      <text x="60" y="312" text-anchor="end">50</text>
      <text x="60" y="414" text-anchor="end">25</text>
      <text x="60" y="504" text-anchor="end">0</text>
      <!-- gridlines -->
      <line x1="80" y1="104" x2="1360" y2="104" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
      <line x1="80" y1="206" x2="1360" y2="206" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
      <line x1="80" y1="308" x2="1360" y2="308" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
      <line x1="80" y1="410" x2="1360" y2="410" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </g>

    <!-- X-axis labels -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#22d3ee" fill-opacity="0.35" text-anchor="middle">
      <text x="200" y="526">Jan</text>
      <text x="400" y="526">Mar</text>
      <text x="600" y="526">May</text>
      <text x="800" y="526">Jul</text>
      <text x="1000" y="526">Sep</text>
      <text x="1200" y="526">Nov</text>
      <text x="1340" y="526">Jan</text>
    </g>

    <!-- Series 1: cyan — "python tutorial" -->
    <path d="M80,430 L120,420 L160,400 L200,370 L240,310 L280,280 L320,300 L360,260 L400,200 L440,180 L480,160 L520,190 L560,220 L600,200 L640,170 L680,150 L720,104 L760,120 L800,140 L840,160 L880,200 L920,240 L960,260 L1000,280 L1040,300 L1080,320 L1120,300 L1160,280 L1200,300 L1240,320 L1280,300 L1320,290 L1360,280"
      fill="url(#chartfill-cyan)" stroke="none"/>
    <path d="M80,430 L120,420 L160,400 L200,370 L240,310 L280,280 L320,300 L360,260 L400,200 L440,180 L480,160 L520,190 L560,220 L600,200 L640,170 L680,150 L720,104 L760,120 L800,140 L840,160 L880,200 L920,240 L960,260 L1000,280 L1040,300 L1080,320 L1120,300 L1160,280 L1200,300 L1240,320 L1280,300 L1320,290 L1360,280"
      fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow-cyan)"/>

    <!-- Series 2: pink — "chatgpt" -->
    <path d="M80,490 L120,488 L160,486 L200,484 L240,480 L280,478 L320,470 L360,450 L400,420 L440,380 L480,330 L520,280 L560,240 L600,200 L640,160 L680,130 L720,120 L760,130 L800,150 L840,180 L880,160 L920,200 L960,220 L1000,240 L1040,260 L1080,250 L1120,240 L1160,260 L1200,280 L1240,300 L1280,320 L1320,310 L1360,300"
      fill="url(#chartfill-pink)" stroke="none"/>
    <path d="M80,490 L120,488 L160,486 L200,484 L240,480 L280,478 L320,470 L360,450 L400,420 L440,380 L480,330 L520,280 L560,240 L600,200 L640,160 L680,130 L720,120 L760,130 L800,150 L840,180 L880,160 L920,200 L960,220 L1000,240 L1040,260 L1080,250 L1120,240 L1160,260 L1200,280 L1240,300 L1280,320 L1320,310 L1360,300"
      fill="none" stroke="#f0abfc" stroke-width="2.5" filter="url(#glow-cyan)"/>

    <!-- Series 3: green — "machine learning" -->
    <path d="M80,460 L120,450 L160,440 L200,420 L240,400 L280,380 L320,360 L360,340 L400,320 L440,300 L480,280 L520,260 L560,250 L600,260 L640,280 L680,300 L720,290 L760,280 L800,300 L840,320 L880,310 L920,300 L960,310 L1000,320 L1040,330 L1080,340 L1120,350 L1160,340 L1200,350 L1240,360 L1280,370 L1320,360 L1360,350"
      fill="url(#chartfill-green)" stroke="none"/>
    <path d="M80,460 L120,450 L160,440 L200,420 L240,400 L280,380 L320,360 L360,340 L400,320 L440,300 L480,280 L520,260 L560,250 L600,260 L640,280 L680,300 L720,290 L760,280 L800,300 L840,320 L880,310 L920,300 L960,310 L1000,320 L1040,330 L1080,340 L1120,350 L1160,340 L1200,350 L1240,360 L1280,370 L1320,360 L1360,350"
      fill="none" stroke="#4ade80" stroke-width="2.5" filter="url(#glow-cyan)"/>

    <!-- Peak dot on cyan -->
    <circle cx="720" cy="104" r="6" fill="#22d3ee" filter="url(#glow-strong)"/>
    <line x1="720" y1="104" x2="720" y2="500" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Tooltip at peak -->
    <g transform="translate(730, 78)">
      <rect width="130" height="36" rx="6" fill="#050510" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1"/>
      <text x="12" y="14" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#22d3ee" fill-opacity="0.6">Jul 2023</text>
      <text x="12" y="28" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#22d3ee" font-weight="700" filter="url(#glow-text)">python tutorial: 100</text>
    </g>

    <!-- Legend -->
    <g transform="translate(88, 20)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2">
      <circle cx="8" cy="8" r="5" fill="#22d3ee" filter="url(#glow-cyan)"/>
      <text x="22" y="13" fill="#22d3ee">python tutorial</text>
      <circle cx="182" cy="8" r="5" fill="#f0abfc" filter="url(#glow-cyan)"/>
      <text x="196" y="13" fill="#f0abfc">chatgpt</text>
      <circle cx="310" cy="8" r="5" fill="#4ade80" filter="url(#glow-cyan)"/>
      <text x="324" y="13" fill="#4ade80">machine learning</text>
    </g>

    <!-- Panel label top right -->
    <g transform="translate(1200, 20)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">
      <text fill="#22d3ee" fill-opacity="0.5">INTEREST OVER TIME</text>
      <text x="0" y="18" fill="#22d3ee" fill-opacity="0.3">2023–2024</text>
    </g>
  </g>

  <!-- CLI strip bottom -->
  <g transform="translate(0, 740)">
    <rect width="1600" height="160" fill="#020208" opacity="0.95"/>
    <line x1="0" y1="0" x2="1600" y2="0" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1"/>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17">
      <text x="48" y="44" fill="#22d3ee" fill-opacity="0.5" filter="url(#glow-text)">$</text>
      <text x="72" y="44" fill="#22d3ee" filter="url(#glow-text)">trends fetch --keyword <tspan fill="#f0abfc">"python tutorial"</tspan> --region US --period 12m</text>
      <text x="48" y="80" fill="#4ade80" fill-opacity="0.8" filter="url(#glow-text)">✓ Fetched 52 data points · peak: Jul 2023 (100) · avg: 68.4</text>
      <text x="48" y="112" fill="#22d3ee" fill-opacity="0.5" filter="url(#glow-text)">$</text>
      <text x="72" y="112" fill="#22d3ee" filter="url(#glow-text)">trends compare <tspan fill="#f0abfc">"chatgpt"</tspan> <tspan fill="#4ade80">"machine learning"</tspan> --export json</text>
      <rect x="1060" y="98" width="11" height="20" fill="#22d3ee" filter="url(#glow-cyan)">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Title top-left -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="48" y="72" font-size="13" fill="#22d3ee" fill-opacity="0.6" letter-spacing="6" filter="url(#glow-text)">GOOGLE TRENDS API TOOLKIT</text>
    <text x="1552" y="72" font-size="13" fill="#22d3ee" fill-opacity="0.4" letter-spacing="4" text-anchor="end">PYTHON · REST · CLI</text>
  </g>

  <!-- corner accent lines -->
  <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.5" filter="url(#glow-cyan)">
    <line x1="0" y1="0" x2="40" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="40"/>
    <line x1="1600" y1="0" x2="1560" y2="0"/>
    <line x1="1600" y1="0" x2="1600" y2="40"/>
    <line x1="0" y1="900" x2="40" y2="900"/>
    <line x1="0" y1="900" x2="0" y2="860"/>
    <line x1="1600" y1="900" x2="1560" y2="900"/>
    <line x1="1600" y1="900" x2="1600" y2="860"/>
  </g>
</svg>
