<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Terminal window -->
  <g transform="translate(260, 170)">
    <!-- Window shadow -->
    <rect x="8" y="12" width="1080" height="560" rx="14" fill="#000" opacity="0.5"/>
    <!-- Window body -->
    <rect width="1080" height="560" rx="14" fill="#0e0e0e" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Title bar -->
    <rect width="1080" height="44" rx="14" fill="#141414"/>
    <rect y="30" width="1080" height="14" fill="#141414"/>
    <line x1="0" y1="44" x2="1080" y2="44" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="24" cy="22" r="6" fill="#3a3a3a"/>
    <circle cx="46" cy="22" r="6" fill="#3a3a3a"/>
    <circle cx="68" cy="22" r="6" fill="#3a3a3a"/>
    <text x="540" y="27" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#666" letter-spacing="1.5">~/.envs  —  zsh</text>

    <!-- Lines -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22">
      <!-- Line 1 -->
      <text x="44" y="110" fill="#555">$</text>
      <text x="72" y="110" fill="#e5e5e5">staging</text>
      <text x="44" y="146" fill="#7c7c7c">
        <tspan fill="#a3a3a3">✓</tspan>
        <tspan dx="12" fill="#cfcfcf">Loaded staging</tspan>
        <tspan dx="12" fill="#666">(5 vars)</tspan>
      </text>

      <!-- Line 2 -->
      <text x="44" y="214" fill="#555">$</text>
      <text x="72" y="214" fill="#e5e5e5">production</text>
      <text x="44" y="250" fill="#a3a3a3">
        <tspan fill="#ddd">!</tspan>
        <tspan dx="12" fill="#999">Load production env? (y/n):</tspan>
        <tspan dx="10" fill="#e5e5e5">y</tspan>
      </text>
      <text x="44" y="282" fill="#7c7c7c">
        <tspan fill="#a3a3a3">✓</tspan>
        <tspan dx="12" fill="#cfcfcf">Loaded production</tspan>
        <tspan dx="12" fill="#666">(12 vars)</tspan>
      </text>

      <!-- Line 3 -->
      <text x="44" y="350" fill="#555">$</text>
      <text x="72" y="350" fill="#e5e5e5">unsetenv</text>
      <text x="44" y="386" fill="#7c7c7c">
        <tspan fill="#a3a3a3">✓</tspan>
        <tspan dx="12" fill="#cfcfcf">Cleared production environment</tspan>
      </text>

      <!-- Prompt with caret -->
      <text x="44" y="454" fill="#555">$</text>
      <rect x="74" y="437" width="12" height="22" fill="#e5e5e5">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Faint env badges on right -->
    <g transform="translate(820, 90)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
      <rect width="210" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="18" cy="16" r="4" fill="#888"/>
      <text x="32" y="20" fill="#bbb">STAGING.ENV</text>

      <rect y="44" width="210" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="18" cy="60" r="4" fill="#e5e5e5"/>
      <text x="32" y="64" fill="#e5e5e5">PRODUCTION.ENV</text>

      <rect y="88" width="210" height="32" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="18" cy="104" r="4" fill="#555"/>
      <text x="32" y="108" fill="#888">GROWTH_STAGING.ENV</text>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(260, 120)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text font-size="14" letter-spacing="6" fill="#666">~/.ENVS</text>
  </g>
  <g transform="translate(1080, 120)" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="end">
    <text x="260" font-size="14" letter-spacing="6" fill="#666">ENVSWITCH</text>
  </g>
</svg>
