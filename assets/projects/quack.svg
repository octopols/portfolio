<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="qsun" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="qdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="#92400e" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#qbg)"/>
  <rect width="1600" height="900" fill="url(#qdots)"/>
  <rect width="1600" height="900" fill="url(#qsun)"/>

  <!-- Floating Duck mark -->
  <g transform="translate(110, 110)">
    <g transform="rotate(-8)">
      <!-- body -->
      <ellipse cx="70" cy="92" rx="66" ry="46" fill="#111111"/>
      <!-- head -->
      <circle cx="118" cy="58" r="34" fill="#111111"/>
      <!-- beak -->
      <path d="M148 52 L196 56 L196 74 L146 72 Z" fill="#f59e0b"/>
      <path d="M148 62 L196 64 L196 72 L146 72 Z" fill="#d97706"/>
      <!-- eye -->
      <circle cx="128" cy="52" r="4" fill="#fbbf24"/>
      <!-- wing -->
      <path d="M60 82 Q90 72 112 96 Q86 108 56 104 Z" fill="#1f1f1f"/>
    </g>
  </g>

  <!-- Browser window -->
  <g transform="translate(340, 140)">
    <!-- shadow -->
    <rect x="10" y="18" width="1080" height="620" rx="18" fill="#000" opacity="0.18"/>
    <rect width="1080" height="620" rx="18" fill="#ffffff"/>

    <!-- Title bar -->
    <rect width="1080" height="48" rx="18" fill="#f5f5f5"/>
    <rect y="32" width="1080" height="16" fill="#f5f5f5"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#e5e5e5"/>
    <circle cx="26" cy="24" r="6" fill="#fb7185"/>
    <circle cx="50" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="74" cy="24" r="6" fill="#34d399"/>
    <g transform="translate(380, 12)">
      <rect width="320" height="24" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="160" y="17" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#737373" letter-spacing="1.2">youtube.com / watch</text>
    </g>

    <!-- Comments header -->
    <g transform="translate(48, 96)" font-family="Inter, system-ui, sans-serif">
      <text font-size="22" font-weight="700" fill="#0a0a0a">12,438 Comments</text>
      <text x="218" y="0" font-size="18" font-weight="400" fill="#737373">Sort by</text>

      <!-- Quack search input -->
      <g transform="translate(620, -22)">
        <rect width="400" height="44" rx="22" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
        <g transform="translate(18, 14)" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6"/>
          <line x1="13" y1="13" x2="17" y2="17"/>
        </g>
        <text x="50" y="28" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#0a0a0a">timestamp</text>
        <rect x="129" y="14" width="2" height="18" fill="#0a0a0a">
          <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <!-- gear -->
        <g transform="translate(360, 14)" stroke="#525252" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="3"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/>
        </g>
      </g>
    </g>

    <!-- Streaming status -->
    <g transform="translate(48, 158)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2">
      <circle cx="6" cy="-4" r="4" fill="#dc2626">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="20" fill="#dc2626" font-weight="700">STREAMING</text>
      <text x="132" fill="#d4d4d4">·</text>
      <text x="150" fill="#404040" font-weight="700">47 MATCHES</text>
      <text x="282" fill="#d4d4d4">·</text>
      <text x="300" fill="#525252">3,218 / 12,438 FETCHED</text>
      <rect x="540" y="-12" width="440" height="6" rx="3" fill="#f5f5f5"/>
      <rect x="540" y="-12" width="114" height="6" rx="3" fill="#dc2626"/>
    </g>

    <!-- Results -->
    <g transform="translate(48, 210)" font-family="Inter, system-ui, sans-serif">
      <!-- Result 1 -->
      <g>
        <circle cx="16" cy="16" r="16" fill="#dc2626"/>
        <text x="16" y="21" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ffffff">a</text>
        <text x="48" y="14" font-size="13" font-weight="700" fill="#0a0a0a">@alexchen</text>
        <text x="150" y="14" font-size="12" fill="#737373">· 2 years ago</text>
        <text x="48" y="36" font-size="14" fill="#262626">best <tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan>is at 4:32 when the drop hits — chills every time</text>
        <rect x="82" y="24" width="84" height="17" rx="3" fill="#fde047"/>
        <text x="88" y="37" font-size="14" font-weight="700" fill="#0a0a0a">timestamp</text>
        <text x="48" y="56" font-size="12" fill="#737373">
          <tspan fill="#dc2626">♥</tspan>
          <tspan dx="6">1.2k</tspan>
          <tspan dx="20">↩ 14 replies</tspan>
        </text>
      </g>

      <!-- Result 2 -->
      <g transform="translate(0, 100)">
        <circle cx="16" cy="16" r="16" fill="#0ea5e9"/>
        <text x="16" y="21" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ffffff">m</text>
        <text x="48" y="14" font-size="13" font-weight="700" fill="#0a0a0a">@maria_k</text>
        <text x="140" y="14" font-size="12" fill="#737373">· 8 months ago</text>
        <text x="48" y="36" font-size="14" fill="#262626">can someone give me the <tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan>for the guitar solo please</text>
        <rect x="220" y="24" width="84" height="17" rx="3" fill="#fde047"/>
        <text x="226" y="37" font-size="14" font-weight="700" fill="#0a0a0a">timestamp</text>
        <text x="48" y="56" font-size="12" fill="#737373">
          <tspan fill="#dc2626">♥</tspan>
          <tspan dx="6">342</tspan>
          <tspan dx="20">↩ 3 replies</tspan>
        </text>
      </g>

      <!-- Result 3 -->
      <g transform="translate(0, 200)">
        <circle cx="16" cy="16" r="16" fill="#10b981"/>
        <text x="16" y="21" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#ffffff">j</text>
        <text x="48" y="14" font-size="13" font-weight="700" fill="#0a0a0a">@jdoe</text>
        <text x="112" y="14" font-size="12" fill="#737373">· 1 year ago</text>
        <text x="48" y="36" font-size="14" fill="#262626">added <tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan><tspan> </tspan>list in my reply below ↓</text>
        <rect x="90" y="24" width="84" height="17" rx="3" fill="#fde047"/>
        <text x="96" y="37" font-size="14" font-weight="700" fill="#0a0a0a">timestamp</text>
        <text x="48" y="56" font-size="12" fill="#737373">
          <tspan fill="#dc2626">♥</tspan>
          <tspan dx="6">89</tspan>
          <tspan dx="20">↩ 1 reply</tspan>
        </text>
      </g>

      <!-- loading skeleton -->
      <g transform="translate(0, 300)">
        <circle cx="16" cy="16" r="16" fill="#f5f5f5"/>
        <rect x="48" y="6" width="120" height="10" rx="5" fill="#f5f5f5"/>
        <rect x="48" y="24" width="520" height="10" rx="5" fill="#f5f5f5"/>
        <rect x="48" y="40" width="380" height="10" rx="5" fill="#f5f5f5"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Sort pills -->
    <g transform="translate(900, 210)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">
      <text fill="#a3a3a3" y="-8">SORT BY</text>
      <g>
        <rect width="140" height="28" rx="14" fill="#0a0a0a"/>
        <text x="70" y="19" text-anchor="middle" fill="#ffffff" font-weight="700">MOST RELEVANT</text>
      </g>
      <g transform="translate(0, 38)">
        <rect width="140" height="28" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="70" y="19" text-anchor="middle" fill="#525252">TOP COMMENTS</text>
      </g>
      <g transform="translate(0, 76)">
        <rect width="140" height="28" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="70" y="19" text-anchor="middle" fill="#525252">NEWEST FIRST</text>
      </g>
      <g transform="translate(0, 114)">
        <rect width="140" height="28" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="70" y="19" text-anchor="middle" fill="#525252">MOST REPLIES</text>
      </g>
      <g transform="translate(0, 152)">
        <rect width="140" height="28" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="70" y="19" text-anchor="middle" fill="#525252">LONGEST</text>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="340" y="118" font-size="14" font-weight="700" fill="#92400e" letter-spacing="6">QUACK</text>
    <text x="1490" y="118" font-size="14" font-weight="700" fill="#92400e" letter-spacing="6" text-anchor="end">YOUTUBE COMMENT SEARCH</text>
  </g>

  <!-- corner star -->
  <g transform="translate(1420, 700)" fill="#dc2626">
    <path d="M40 0 L48 32 L80 40 L48 48 L40 80 L32 48 L0 40 L32 32 Z"/>
  </g>
</svg>
